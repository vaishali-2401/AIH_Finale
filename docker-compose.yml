# docker compose up --build   ->  http://localhost:8080
#
# Optional: put GEMINI_API_KEY=... in a .env file next to this one (git-ignored)
# to enable AI ranking, insights and Gemini voices.
services:
  app:
    build: .
    image: connecting-the-dots
    ports:
      - "8080:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TTS_ENABLED: ${TTS_ENABLED:-true}
    volumes:
      - ctd-data:/data
    restart: unless-stopped

volumes:
  ctd-data:
