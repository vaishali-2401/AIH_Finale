name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: python -m pytest -q

  frontend:
    name: Frontend (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend_app/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend (for end-to-end tests)
        run: pip install -r backend/requirements.txt
      - name: Install frontend
        working-directory: frontend_app
        run: npm ci
      - working-directory: frontend_app
        run: npm run lint
      - working-directory: frontend_app
        run: npm run typecheck
      - working-directory: frontend_app
        run: npm test
      - working-directory: frontend_app
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend_app
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend_app
        env:
          E2E_PYTHON: python
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend_app/playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t connecting-the-dots .
      - name: Smoke test the container
        run: |
          docker run -d --name ctd -p 8080:8080 connecting-the-dots
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Connecting the Dots"
          curl -fsS -o /dev/null http://127.0.0.1:8080/pdfjs/pdf.worker.min.mjs
      - if: always()
        run: docker logs ctd || true
